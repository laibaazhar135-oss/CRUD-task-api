services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: devpassword123
      POSTGRES_DB: tasksdb
    ports:
      - "5432:5432"
    volumes:
      - tasks-pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:devpassword123@db:5432/tasksdb
      PORT: 3000
      REDIS_URL: redis://redis:6379
    depends_on:
      - db
      - redis

volumes:
  tasks-pgdata: